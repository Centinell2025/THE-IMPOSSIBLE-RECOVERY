name: Validate full DFIR exercise
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source and documentation quality
        run: python3 tools/quality_gate.py
      - name: Validate advanced evidence
        run: python3 tools/test_advanced.py
      - name: Validate forensic scenario consistency
        run: python3 tools/validate_case_semantics.py
